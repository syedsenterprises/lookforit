<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="AI voice agent answering business phone calls">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0faf9"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="130" fill="#7c3aed" opacity="0.07"/>
  <circle cx="1060" cy="520" r="140" fill="#0d9488" opacity="0.08"/>
  <!-- phone -->
  <rect x="480" y="110" width="240" height="410" rx="40" fill="url(#phone)"/>
  <rect x="500" y="130" width="200" height="300" rx="24" fill="#ffffff"/>
  <circle cx="600" cy="465" r="18" fill="#ffffff" opacity="0.85"/>
  <circle cx="600" cy="465" r="8" fill="#0f766e"/>
  <!-- screen: waveform + bubble -->
  <rect x="525" y="160" width="150" height="90" rx="16" fill="#ccfbf1"/>
  <path d="M545 205 v-14 M560 205 v-24 M575 205 v-30 M590 205 v-20 M605 205 v-28 M620 205 v-16 M635 205 v-24 M650 205 v-12" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <rect x="525" y="270" width="150" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="525" y="296" width="110" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="525" y="330" width="150" height="56" rx="28" fill="#0d9488"/>
  <text x="600" y="367" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Answering…</text>
  <!-- sound waves -->
  <g fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round">
    <path d="M770 220 q40 40 0 130" opacity="0.9"/>
    <path d="M810 190 q60 70 0 190" opacity="0.6"/>
    <path d="M850 160 q80 100 0 250" opacity="0.35"/>
    <path d="M430 220 q-40 40 0 130" opacity="0.9"/>
    <path d="M390 190 q-60 70 0 190" opacity="0.6"/>
    <path d="M350 160 q-80 100 0 250" opacity="0.35"/>
  </g>
  <!-- headset chip -->
  <circle cx="600" cy="560" r="10" fill="#f59e0b"/>
  <text x="600" y="610" font-family="sans-serif" font-size="22" fill="#475569" text-anchor="middle">24/7 voice agent</text>
</svg>
